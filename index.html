<!-- 這兩個 meta 標籤在 Artifact 環境是多餘的（平台會自動注入），
     但這份檔案同時也原封不動地當成 GitHub Pages 的 index.html 使用，
     那裡沒有任何外層 wrapper —— 少了 viewport，手機瀏覽器會以桌面寬度
     渲染整頁再縮小塞進螢幕。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WD</title>
<link rel="icon" href="Dashboard_icon.png" type="image/png">
<link rel="apple-touch-icon" href="Dashboard_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0A0912;
    --ink:#EEEAF8;
    --ink-70:rgba(238,234,248,.72);
    --ink-60:rgba(238,234,248,.6);
    --ink-50:rgba(238,234,248,.5);
    --ink-45:rgba(238,234,248,.45);
    --ink-40:rgba(238,234,248,.4);
    --ink-34:rgba(238,234,248,.34);
    --accent:#B79CFF;
    --accent-lt:#D5C7FF;
    --hair:rgba(255,255,255,.09);
    --hair-soft:rgba(255,255,255,.06);
    --fill-04:rgba(255,255,255,.04);
    --fill-07:rgba(255,255,255,.07);
    --warn:#ff5a4f;
    --sans:Sora,"Noto Sans TC",system-ui,-apple-system,sans-serif;
    --cjk:"Noto Sans TC",Sora,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
    /* 各項目的主色；單項頁面另外用 --k-deep / --k-mid / --k-light / --k-pale 四階同色系 */
    --run:#FF9A3C; --ride:#FFD166; --en:#6FD3FF; --ai:#B79CFF;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{background:var(--bg);}
  body{
    margin:0;color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  a{color:inherit;}

  /* ---------- 背景：深紫光暈 + 星點 ---------- */
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(900px 700px at 50% 42%,#1A1530,var(--bg) 70%);
    transition:background .6s;}
  body[data-view="running"] .sky{background:radial-gradient(900px 700px at 28% 36%,#2A1A10,var(--bg) 70%);}
  body[data-view="cycling"] .sky{background:radial-gradient(900px 700px at 28% 36%,#27200E,var(--bg) 70%);}
  body[data-view="english"] .sky{background:radial-gradient(900px 700px at 28% 36%,#0E1F2C,var(--bg) 70%);}
  body[data-view="ai"] .sky{background:radial-gradient(900px 700px at 28% 36%,#1C1533,var(--bg) 70%);}
  .star{position:absolute;border-radius:50%;background:#fff;opacity:.15;animation:twinkle 3.2s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.75}}

  /* 環外的日期標註與旋轉刻度會超出容器一點點，裁掉水平溢出，手機才不會左右晃 */
  .shell{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:28px 40px 24px;overflow-x:clip;}
  @media(max-width:700px){ .shell{padding:18px 16px 20px;} }

  /* ---------- 頁首 ---------- */
  .top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:56px;}
  .brand{display:flex;flex-direction:column;gap:7px;min-width:0;}
  .brand .t{font:700 24px/1 var(--sans);letter-spacing:.06em;margin:0;}
  .brand .s{font:400 11px/1 var(--mono);letter-spacing:.14em;color:var(--ink-50);white-space:nowrap;}
  .brand .s .wx{color:var(--ink-70);}
  .brand .s .wx.stale{opacity:.5;}
  .top .sp{flex:1;}
  .seg{display:flex;padding:4px;gap:4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
  .seg button{height:36px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--ink-70);
    font:500 13px/1 var(--cjk);cursor:pointer;transition:background .2s,color .2s;}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#16122A;font-weight:700;}
  .seg button:focus-visible,.back:focus-visible,.tab:focus-visible,.kpi:focus-visible,.plus:focus-visible{outline:2px solid var(--accent-lt);outline-offset:2px;}
  .back{height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 12px;border-radius:999px;
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--ink);text-decoration:none;
    font:400 13px/1 var(--cjk);}
  .back svg{width:16px;height:16px;}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;flex:none;
    background:rgba(255,255,255,.04);border:1px solid transparent;color:var(--ink-70);text-decoration:none;
    font:500 12px/1 var(--mono);letter-spacing:.1em;}
  .tab i{width:7px;height:7px;border-radius:50%;}
  .tab[aria-current="page"]{background:linear-gradient(135deg,var(--k-deep),var(--k-mid));color:#140F08;font-weight:600;}
  .tab[aria-current="page"] i{background:#140F08 !important;}
  .plus{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
    color:var(--ink);cursor:pointer;display:none;align-items:center;justify-content:center;}
  .plus svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;}
  .adds[data-k="running"] #add-running,.adds[data-k="cycling"] #add-cycling,.adds[data-k="english"] #add-english{display:inline-flex;}

  /* ---------- 卡片基底 ---------- */
  .panel{border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);}
  .cap{font:600 13px/1 var(--sans);letter-spacing:.16em;}
  .cap-sub{font:400 12px/1.4 var(--cjk);color:var(--ink-50);}
  .mono{font-family:var(--mono);}

  /* ---------- 總覽 ---------- */
  .ov{display:grid;grid-template-columns:330px minmax(0,1fr) 330px;gap:28px;align-items:center;margin-top:18px;}
  .ov .side{display:flex;flex-direction:column;gap:28px;}
  .kpi{display:flex;flex-direction:column;gap:12px;padding:22px 24px;text-decoration:none;color:inherit;
    transition:transform .25s,border-color .25s,background .25s;}
  .kpi:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.06);}
  .kpi .h{display:flex;align-items:center;gap:10px;}
  .kpi .h i{width:10px;height:10px;border-radius:50%;}
  .kpi .h b{font:600 13px/1 var(--sans);letter-spacing:.14em;}
  .kpi .h span{font:400 13px/1 var(--cjk);color:var(--ink-60);}
  .kpi .h em{margin-left:auto;font:400 10px/1 var(--mono);font-style:normal;color:var(--ink-40);}
  .kpi .big{display:flex;align-items:baseline;gap:8px;}
  .kpi .big .v{font:300 54px/1 var(--sans);}
  .kpi .big .u{font:400 12px/1 var(--mono);color:var(--ink-50);}
  .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;}
  .bar > div{height:100%;border-radius:2px;}
  .kpi .f{display:flex;gap:10px;font:400 12px/1.3 var(--cjk);color:var(--ink-60);}
  .kpi .f span:last-child{margin-left:auto;text-align:right;}

  .orbit{position:relative;width:100%;max-width:640px;aspect-ratio:1;margin:0 auto;}
  .orbit > svg,.orbit > .radar,.orbit > .core{position:absolute;}
  .orbit > svg{inset:0;width:100%;height:100%;overflow:visible;}
  .radar{inset:3%;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(183,156,255,0) 0deg,rgba(183,156,255,0) 290deg,rgba(183,156,255,.22) 360deg);
    -webkit-mask-image:radial-gradient(circle closest-side,transparent 36%,#000 37%,#000 96%,transparent 97%);
            mask-image:radial-gradient(circle closest-side,transparent 36%,#000 37%,#000 96%,transparent 97%);
    animation:spin 7s linear infinite;}
  .spin-slow{transform-origin:50% 50%;transform-box:view-box;animation:spin 90s linear infinite;}
  .spin-rev{transform-origin:50% 50%;transform-box:view-box;animation:spin 140s linear infinite reverse;}
  .core{left:34.4%;top:34.4%;width:31.2%;height:31.2%;border-radius:50%;border:1px solid rgba(183,156,255,.4);
    background:radial-gradient(circle,rgba(40,30,72,.95),rgba(14,11,26,.95));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;
    animation:coreGlow 4s ease-in-out infinite;}
  @keyframes coreGlow{0%,100%{box-shadow:0 0 40px rgba(183,156,255,.25),inset 0 0 30px rgba(183,156,255,.12)}
    50%{box-shadow:0 0 70px rgba(183,156,255,.45),inset 0 0 40px rgba(183,156,255,.22)}}
  .core .dw{font:400 11px/1 var(--mono);letter-spacing:.2em;color:var(--ink-50);}
  .core .dt{font:300 clamp(24px,4.2vw,40px)/1 var(--sans);}
  .core .ck{font:400 clamp(11px,1.3vw,15px)/1 var(--mono);color:var(--ai);}
  .core .wt{font:400 12px/1.2 var(--cjk);color:var(--ink-60);}
  .ring-hit{cursor:pointer;}
  .ring-hit:hover{filter:brightness(1.25);}

  .tl{margin-top:24px;padding:20px 28px 22px;display:flex;flex-direction:column;gap:18px;}
  .tl .hd{display:flex;align-items:baseline;gap:12px;}
  .tl .track{position:relative;height:56px;margin:8px 0 0;}
  .tl .line{position:absolute;left:0;right:0;top:12px;height:2px;
    background:linear-gradient(90deg,var(--ai),var(--en) 30%,var(--run));}
  .tl .mo{position:absolute;top:-6px;transform:translateX(-50%);font:400 10px/1 var(--mono);color:var(--ink-34);}
  .tl .now{position:absolute;left:0;top:6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ai);}
  .tl .nowt{position:absolute;left:0;top:32px;font:400 12px/1 var(--cjk);color:var(--ai);}
  .tl .ev{position:absolute;top:2px;transform:translateX(-100%);display:flex;flex-direction:column;align-items:flex-end;}
  .tl .ev i{width:2px;height:22px;}
  .tl .ev span{margin-top:6px;font:400 12px/1 var(--cjk);white-space:nowrap;}
  .tl .ev b{font:500 12px/1 var(--mono);}
  .tl .travel{position:absolute;top:7px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;
    box-shadow:0 0 16px #fff;animation:travel 5s cubic-bezier(.5,0,.5,1) infinite;}
  @keyframes travel{from{left:0%;opacity:0}10%{opacity:1}90%{opacity:1}to{left:100%;opacity:0}}
  .tl .list{display:none;flex-direction:column;gap:10px;}
  .tl .list div{display:flex;gap:12px;align-items:baseline;font:400 13px/1.3 var(--cjk);}
  .tl .list b{font:500 14px/1 var(--mono);min-width:58px;}
  .tl .list span:last-child{margin-left:auto;color:var(--ink-50);font-size:12px;}

  /* ---------- 單項頁 ---------- */
  .dt-grid{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:40px;align-items:start;margin-top:18px;}
  .dt-right{display:flex;flex-direction:column;gap:18px;min-width:0;}
  .selcard{padding:24px 28px;display:flex;flex-direction:column;gap:16px;border-radius:18px;
    background:linear-gradient(135deg,rgba(var(--k-rgb),.2),rgba(var(--k-deep-rgb),.05) 70%);
    border:1px solid rgba(var(--k-rgb),.45);}
  .selcard .h{display:flex;align-items:center;gap:10px;}
  .selcard .h .tag{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--k-light);}
  .selcard .h .hint{margin-left:auto;font:400 12px/1 var(--cjk);color:var(--ink-45);}
  .selcard .m{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .selcard .m .nm{font:700 24px/1.2 var(--cjk);min-width:0;}
  .selcard .m .sp{flex:1;}
  .selcard .m .v{font:300 44px/1 var(--sans);}
  .selcard .m .u{font:400 12px/1 var(--mono);color:var(--ink-50);}
  .grad-txt{background:linear-gradient(180deg,var(--k-pale),var(--k-mid) 60%,var(--k-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
  .stats > div{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .stats .k{font:400 11px/1.2 var(--cjk);color:var(--ink-50);}
  .stats .v{font:400 19px/1.1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpis4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
  .kpis4 > div{position:relative;overflow:hidden;padding:16px 18px;display:flex;flex-direction:column;gap:8px;}
  /* 每張小卡頂端一條由深到淺的色條，四張各取同色系的不同段 */
  .kpis4 > div::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--stripe);}
  .kpis4 .k{font:400 11px/1.2 var(--cjk);color:var(--ink-50);}
  .kpis4 .v{font:400 23px/1.1 var(--sans);color:var(--tone);white-space:nowrap;}
  .rows{padding:20px 22px;display:flex;flex-direction:column;gap:10px;}
  .rows .hd{display:flex;align-items:baseline;gap:10px;padding:0 4px;}
  .rows .hd .cap-sub{margin-left:auto;}
  .rows .rl{display:flex;flex-direction:column;gap:4px;max-height:268px;overflow-y:auto;scrollbar-width:thin;}
  .rw{display:grid;grid-template-columns:52px minmax(0,190px) minmax(0,1fr) 78px;align-items:center;gap:14px;
    padding:8px 10px;border-radius:10px;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;width:100%;}
  .rw:hover{background:rgba(255,255,255,.04);}
  .rw[aria-pressed="true"]{background:rgba(var(--k-rgb),.13);}
  .rw .d{font:400 12px/1 var(--mono);color:var(--ink-60);}
  .rw .n{font:400 13px/1.2 var(--cjk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rw .bars{position:relative;height:12px;}
  .rw .bars div{position:absolute;left:0;border-radius:3px;}
  .rw .bars .p{top:0;height:6px;background:linear-gradient(90deg,var(--k-deep),var(--k-mid) 60%,var(--k-light));}
  .rw .bars .s{top:8px;height:3px;background:rgba(var(--k-light-rgb),.4);}
  .rw .x{font:400 13px/1 var(--mono);text-align:right;color:var(--k-pale);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 0;}
  .chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;
    background:rgba(var(--k-rgb),.1);border:1px solid rgba(var(--k-rgb),.3);font:400 12px/1 var(--cjk);color:var(--k-pale);text-decoration:none;}
  a.chip:hover{background:rgba(var(--k-rgb),.2);}
  .trend{margin-top:24px;padding:20px 28px 16px;display:flex;flex-direction:column;gap:10px;}
  .trend .hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .trend .hd .r{margin-left:auto;font:400 11px/1 var(--mono);color:var(--ink-40);}
  .trend .plot{position:relative;height:120px;}
  .trend svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .trend .dot{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
    background:var(--bg);border:1.5px solid var(--k-light);}
  .trend .ax{position:relative;height:14px;font:400 10px/1 var(--mono);color:var(--ink-40);}
  .trend .ax span{position:absolute;transform:translateX(-50%);white-space:nowrap;}
  .trend .ax span:first-child{transform:none;}
  .trend .ax span.end{transform:translateX(-100%);color:var(--k-light);}
  .empty{padding:18px 6px;font:400 13px/1.4 var(--cjk);color:var(--ink-45);}

  /* ---------- 動態 ---------- */
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 環狀圖順時針展開：用可動畫的角度變數推一個錐形遮罩 */
  @property --rv{syntax:'<angle>';inherits:false;initial-value:0deg}
  .reveal{-webkit-mask-image:conic-gradient(#000 var(--rv),transparent 0);mask-image:conic-gradient(#000 var(--rv),transparent 0);
    animation:reveal 1.9s cubic-bezier(.3,.7,.2,1) forwards;}
  @keyframes reveal{from{--rv:0deg}to{--rv:360deg}}
  html.no-prop .reveal{-webkit-mask-image:none;mask-image:none;animation:fadeIn 1.2s ease backwards;}
  .up{animation:up .8s cubic-bezier(.2,.8,.2,1) backwards;}
  @keyframes up{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}
  .grow{transform-origin:0 50%;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) backwards;}
  @keyframes grow{from{transform:scaleX(0)}}
  .draw{stroke-dasharray:100;animation:draw 2.2s cubic-bezier(.4,0,.2,1) backwards;}
  @keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  .arc{animation:arc 1.8s cubic-bezier(.2,.8,.2,1) backwards .4s;}
  @keyframes arc{from{stroke-dashoffset:100}}
  .fadeIn{animation:fadeIn 1.2s ease backwards;}
  /* 趨勢線由左往右掃出來（虛線長度在 non-scaling-stroke 下不可靠，改用裁切） */
  .wipe{animation:wipe 2.2s cubic-bezier(.4,0,.2,1) backwards;}
  @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes fadeIn{from{opacity:0}}
  .ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite;}
  @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.3);opacity:0}}
  /* 滑到才播：區塊進入畫面前，進場動畫停在第一格 */
  .sec:not(.in) .reveal,.sec:not(.in) .up,.sec:not(.in) .grow,.sec:not(.in) .draw,
  .sec:not(.in) .arc,.sec:not(.in) .fadeIn,.sec:not(.in) .wipe{animation-play-state:paused;}
  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
    .reveal{-webkit-mask-image:none;mask-image:none;}
  }

  /* ---------- 響應式 ---------- */
  @media(max-width:1180px){
    .ov{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
    .ov .orbit-wrap{grid-column:1 / -1;order:-1;}
    .ov .side{gap:20px;}
    .dt-grid{grid-template-columns:minmax(0,1fr);}
    .dt-grid .orbit{max-width:560px;}
  }
  @media(max-width:700px){
    .brand .t{font-size:19px;}
    .ov{grid-template-columns:minmax(0,1fr);gap:18px;}
    .ov .side{gap:18px;}
    .kpi .big .v{font-size:44px;}
    .tl{padding:18px 18px;}
    .tl .track{display:none;}
    .tl .list{display:flex;}
    .stats,.kpis4{grid-template-columns:repeat(2,minmax(0,1fr));}
    .selcard,.rows,.trend{padding-left:18px;padding-right:18px;}
    .selcard .h .hint{display:none;}
    .rw{grid-template-columns:44px minmax(0,1fr) 64px;}
    .rw .bars{grid-column:1 / -1;grid-row:2;}
    .top .sp{display:none;}
    .top .grow-row{width:100%;}
  }

  .copyright{text-align:center;margin:26px 0 0;font:400 10px/1.5 var(--mono);letter-spacing:.08em;color:rgba(238,234,248,.26);}
  .skel{background:linear-gradient(90deg,var(--fill-04) 25%,var(--fill-07) 37%,var(--fill-04) 63%);
    background-size:400% 100%;animation:sh 1.4s ease infinite;border-radius:5px;}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
  @media(prefers-reduced-motion:reduce){.skel{animation:none}}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:rgba(26,22,18,.78);border:1px solid rgba(255,255,255,.14);color:var(--ink);
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
    font:400 12.5px/1.4 var(--cjk);padding:10px 18px;border-radius:99px;
    box-shadow:0 12px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14);
    display:flex;align-items:center;gap:9px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .toast .sp{width:13px;height:13px;border-radius:50%;flex:none;
    border:2px solid rgba(234,231,226,.25);border-top-color:var(--accent-lt);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.toast .sp{animation:none}}

  /* 檔案輸入不能用 display:none —— Safari／iOS 會擋掉對隱藏元素的程式化 click()，
     按鈕就會完全沒反應。改成移到畫面外但仍可互動。 */
  /* ---------- 手動輸入表單 ---------- */

<script>
(function(){
  "use strict";

  var WINDOW_DAYS = 30;   // 30 = 近 30 天；0 = 全部（從第一筆紀錄到今天）
  var state = { running:null, cycling:null, ai:null, english:null, goals:null, weather:null };
  var sel = { running:null, cycling:null, ai:null, english:null };   // 單項頁目前選取的日期
  var VIEW = null;        // null = 總覽；否則為 running / cycling / english / ai
  var DET = null;         // 單項頁目前的計算結果，點選日期時局部更新用
  var db = null, sample = null, sampleImages = false, staticMode = false;
  var REDUCE_MOTION = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  if(!(window.CSS && CSS.registerProperty)) document.documentElement.classList.add("no-prop");

  // ---------- date / format helpers ----------
  function tpeToday(){
    var now = new Date();
    var t = new Date(now.getTime() + (now.getTimezoneOffset()*60000) + 8*3600000);
    return t.toISOString().slice(0,10);
  }
  function shiftDay(iso, n){
    var d = new Date(iso+"T00:00:00Z");
    d.setUTCDate(d.getUTCDate()+n);
    return d.toISOString().slice(0,10);
  }
  function lastDays(n){
    var end = tpeToday(), out = [];
    for(var i=n-1;i>=0;i--) out.push(shiftDay(end,-i));
    return out;
  }
  function md(iso){ if(!iso) return ""; var p = iso.split("-"); return p[1]+"/"+p[2]; }
  function fmtKm(v,d){ return (Number(v)||0).toFixed(d==null?1:d); }
  function fmtHM(sec){
    sec = Math.max(0,Math.round(sec||0));
    var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
    return h>0 ? h+"h"+String(m).padStart(2,"0")+"m" : m+"m";
  }
  function fmtHours(sec){ return ((sec||0)/3600).toFixed(1); }
  function fmtPace(secPerKm){
    if(!secPerKm||!isFinite(secPerKm)) return "—";
    var m = Math.floor(secPerKm/60), s = Math.round(secPerKm%60);
    if(s===60){m++;s=0;}
    return m+"'"+String(s).padStart(2,"0")+'"';
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  // 資料庫／JSON 裡的值不保證是數字，插進 HTML 前一律強制轉成數值字面值
  function num(v){ var n = Number(v); return isFinite(n) ? String(n) : "—"; }

  // WMO 天氣代碼 → 中文說明與圖示
  var WMO = {
    0:["晴","☀️"],1:["大致晴朗","🌤️"],2:["多雲時晴","⛅"],3:["陰","☁️"],
    45:["霧","🌫️"],48:["霧淞","🌫️"],
    51:["毛毛雨","🌦️"],53:["毛毛雨","🌦️"],55:["毛毛雨","🌦️"],
    56:["凍毛雨","🌧️"],57:["凍毛雨","🌧️"],
    61:["小雨","🌧️"],63:["中雨","🌧️"],65:["大雨","🌧️"],
    66:["凍雨","🌧️"],67:["凍雨","🌧️"],
    71:["小雪","🌨️"],73:["中雪","🌨️"],75:["大雪","🌨️"],77:["雪粒","🌨️"],
    80:["陣雨","🌦️"],81:["陣雨","🌧️"],82:["強陣雨","🌧️"],
    85:["陣雪","🌨️"],86:["陣雪","🌨️"],
    95:["雷雨","⛈️"],96:["雷雨冰雹","⛈️"],99:["雷雨冰雹","⛈️"]
  };
  var clockFmt = new Intl.DateTimeFormat("en-US",{
    hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true,timeZone:"Asia/Taipei"
  });
  var hourFmt = new Intl.DateTimeFormat("en-US",{hour:"2-digit",hour12:false,timeZone:"Asia/Taipei"});

  function tpeHour(){ return parseInt(hourFmt.format(new Date()),10)%24; }


  // ---------- toast ----------
  var toast = document.getElementById("toast"),
      toastTx = document.getElementById("toast-tx"),
      toastSp = document.getElementById("toast-sp"), tmr = null;
  function showToast(msg, spin){
    clearTimeout(tmr);
    toastTx.textContent = msg;
    toastSp.style.display = spin ? "block" : "none";
    toast.classList.add("show");
    if(!spin) tmr = setTimeout(function(){ toast.classList.remove("show"); }, 3400);
  }
  function hideToast(){ toast.classList.remove("show"); }


  // ---------- 項目設定 ----------
  var KINDS = ["running","cycling","english","ai"];
  var HASH = {running:"run", cycling:"ride", english:"en", ai:"ai"};
  // pal：深 → 主 → 淺 → 最淺，單項頁的層次都從這四階取
  var META = {
    running:{code:"RUN",  zh:"跑步",    ring:"OUTER RING", pal:["#C2410C","#FF9A3C","#FFC98A","#FFE8CC"]},
    cycling:{code:"RIDE", zh:"騎車",    ring:"RING 2",     pal:["#B98300","#FFD166","#FFE49E","#FFF4D6"]},
    english:{code:"EN",   zh:"英文",    ring:"RING 3",     pal:["#1C7FB5","#6FD3FF","#A9E7FF","#DFF7FF"]},
    ai:     {code:"AI",   zh:"AI 學習", ring:"INNER RING", pal:["#6A48D6","#B79CFF","#D5C7FF","#EFEAFF"]}
  };
  var DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  function rgbOf(hex){ return [1,3,5].map(function(i){ return parseInt(hex.substr(i,2),16); }).join(","); }
  function dowOf(iso){ return DOW[new Date(iso+"T00:00:00Z").getUTCDay()]; }
  function f1(n){ return (Math.round(n*10)/10).toFixed(1); }
  function comma(n){ return Math.round(Number(n)||0).toLocaleString("en-US"); }
  function winTag(){ return WINDOW_DAYS>0 ? WINDOW_DAYS+"D" : "全部"; }
  function minKey(obj){
    var m = null;
    Object.keys(obj).forEach(function(k){ if(m===null || k<m) m = k; });
    return m;
  }
  function minDate(list){
    var m = null;
    list.forEach(function(x){ if(x && (m===null || x<m)) m = x; });
    return m;
  }
  function rangeDates(from, to){
    var out = [], dt = from;
    while(dt<=to){ out.push(dt); dt = shiftDay(dt,1); }
    return out;
  }
  // 視窗內的日期：近 30 天，或「全部」＝從 firstDate 到今天
  function windowDates(firstDate){
    if(WINDOW_DAYS>0 || !firstDate) return lastDays(WINDOW_DAYS>0 ? WINDOW_DAYS : 30);
    var out = rangeDates(firstDate, tpeToday());
    return out.length>1 ? out : lastDays(30);
  }

  // 把各來源的資料整理成「日期 → 當日紀錄」，v 是畫在環上的值（公里或小時）
  function records(kind){
    var doc = state[kind], by = {};
    if(!doc) return by;
    function slot(dt, init){ return by[dt] || (by[dt] = init); }
    if(kind==="running" || kind==="cycling"){
      (doc.days||[]).forEach(function(d){
        if(!d.date) return;
        var t = slot(d.date, {date:d.date, km:0, sec:0, elev:0, name:""});
        t.km += Number(d.km)||0; t.sec += Number(d.durationSec)||0; t.elev += Number(d.elevationM)||0;
        if(!t.name && d.name) t.name = d.name;
      });
      (doc.syncedRecent||[]).forEach(function(a){ if(by[a.date] && !by[a.date].name) by[a.date].name = a.name; });
      (doc.manualEntries||[]).forEach(function(m){
        if(!m.date) return;
        var t = slot(m.date, {date:m.date, km:0, sec:0, elev:0, name:""});
        t.km += Number(m.distance_km)||0; t.sec += Number(m.duration_sec)||0; t.elev += Number(m.elevation_gain_m)||0;
        t.manual = true;
        if(!t.name && m.note) t.name = m.note;
      });
      // 距離趨近 0 的誤觸紀錄不算一次活動
      Object.keys(by).forEach(function(k){ var t = by[k]; t.v = t.km>=0.05 ? t.km : 0; });
    } else if(kind==="english"){
      (doc.history||[]).forEach(function(h){
        if(!h.date) return;
        var t = slot(h.date, {date:h.date, sec:0, q:0, vocab:0, score:null, lc:null, rc:null});
        t.sec += Number(h.study_time_sec)||0; t.q += Number(h.questions_count)||0; t.vocab += Number(h.vocab_count)||0;
        if(h.toeic_predicted!=null){ t.score = h.toeic_predicted; t.lc = h.toeic_lc; t.rc = h.toeic_rc; }
      });
      // 今天進行中的學習只存在 latest，還沒進 history
      var L = doc.latest;
      if(L && L.date && !by[L.date]){
        by[L.date] = {date:L.date, sec:Number(L.study_time_sec)||0, q:Number(L.questions_count)||0,
          vocab:Number(L.vocab_count)||0, score:L.toeic_predicted, lc:L.toeic_lc, rc:L.toeic_rc, live:true};
      }
      Object.keys(by).forEach(function(k){ by[k].v = by[k].sec/3600; });
    } else {
      (doc.daily||[]).forEach(function(d){
        if(!d.date) return;
        var t = slot(d.date, {date:d.date, sec:0, sessions:0});
        t.sec += Number(d.seconds)||0; t.sessions += Number(d.sessions)||0;
      });
      Object.keys(by).forEach(function(k){ by[k].v = by[k].sec/3600; });
    }
    return by;
  }
  function daysOf(by, dates){
    return dates.map(function(dt){ return by[dt] || {date:dt, v:0, km:0, sec:0, elev:0, q:0, vocab:0, sessions:0}; });
  }
  function sumOf(days, key){ return days.reduce(function(a,d){ return a+(Number(d[key])||0); },0); }
  function activeOf(days){ return days.filter(function(d){ return d.v>0; }); }
  function goalFor(kind, n){
    var g = state.goals || {};
    var monthly = kind==="running" ? g.runMonthlyKm : (kind==="cycling" ? g.rideMonthlyKm : null);
    return monthly!=null ? monthly*n/30 : null;
  }
  function latestScore(){
    var L = state.english && state.english.latest;
    return L ? {score:L.toeic_predicted, lc:L.toeic_lc, rc:L.toeic_rc} : {score:null, lc:null, rc:null};
  }

  // 專案右側的資料夾圖示連結。只接受 http(s)，不讓資料庫裡的字串變成 javascript: 連結。
  function repoLink(url){
    if(typeof url!=="string" || !/^https?:\/\//i.test(url)) return "";
    return url;
  }

  // ---------- 環狀圖幾何 ----------
  function pt(c, r, deg){ var a = deg*Math.PI/180; return [c+r*Math.cos(a), c+r*Math.sin(a)]; }
  function r1(n){ return n.toFixed(1); }
  function sector(c, ra, rb, a0, a1){
    var p0 = pt(c,rb,a0), p1 = pt(c,rb,a1), p2 = pt(c,ra,a1), p3 = pt(c,ra,a0);
    var big = (a1-a0)>180 ? 1 : 0;
    return "M"+r1(p0[0])+" "+r1(p0[1])+"A"+rb+" "+rb+" 0 "+big+" 1 "+r1(p1[0])+" "+r1(p1[1])+
      "L"+r1(p2[0])+" "+r1(p2[1])+"A"+ra+" "+ra+" 0 "+big+" 0 "+r1(p3[0])+" "+r1(p3[1])+"Z";
  }
  function segAngles(i, n){
    var step = 360/n, gap = Math.min(2.4, step*0.2), a0 = -90+i*step+gap/2;
    return [a0, a0+step-gap, a0+(step-gap)/2];
  }

  // ---------- 總覽 ----------
  function kpiHtml(kind, days, delay){
    var M = META[kind], pal = M.pal, N = days.length;
    var total = sumOf(days, "v"), big, dec = 1, unit, w = 0, goalTx, side;
    if(kind==="running" || kind==="cycling"){
      var goal = goalFor(kind, N), sec = sumOf(days,"sec");
      big = total; unit = "KM · "+winTag();
      w = goal ? Math.min(1, total/goal) : 0;
      goalTx = goal ? "目標 "+Math.round(goal)+" km · "+Math.round(total/goal*100)+"%" : "目標未設定";
      side = kind==="running"
        ? "配速 "+fmtPace(total>0 ? sec/total : 0)
        : "爬升 "+comma(sumOf(days,"elev"))+" m";
    } else if(kind==="english"){
      var sc = latestScore();
      big = total; unit = "HRS · "+winTag();
      w = sc.score!=null ? sc.score/990 : 0;
      goalTx = sc.score!=null ? "多益預測 "+num(sc.score) : "尚無多益預測";
      side = (sc.lc!=null ? "LC "+num(sc.lc) : "")+(sc.rc!=null ? " · RC "+num(sc.rc) : "");
    } else {
      var act = activeOf(days).length;
      big = total; unit = "HRS · "+winTag();
      w = N ? act/N : 0;
      goalTx = "活躍 "+act+" / "+N+" 天";
      side = num((state.ai||{}).projectCount||0)+" 個專案";
    }
    return '<a class="kpi panel sec" href="#'+HASH[kind]+'" aria-label="查看'+esc(M.zh)+'詳細">'+
      '<div class="h"><i style="background:'+pal[1]+';box-shadow:0 0 12px '+pal[1]+'"></i>'+
        '<b>'+esc(M.code)+'</b><span>'+esc(M.zh)+'</span><em>'+esc(M.ring)+'</em></div>'+
      '<div class="big up" style="animation-delay:'+delay+'s">'+
        '<span class="v cnt" data-to="'+total+'" data-dec="'+dec+'">'+f1(big)+'</span>'+
        '<span class="u">'+esc(unit)+'</span></div>'+
      '<div class="bar"><div class="grow" style="width:'+(w*100).toFixed(1)+'%;background:'+pal[1]+';animation-delay:'+delay+'s"></div></div>'+
      '<div class="f"><span>'+esc(goalTx)+'</span><span>'+esc(side)+'</span></div>'+
    '</a>';
  }

  // 四圈由外到內：跑步、騎車、英文、AI
  var RINGS = [["running",254],["cycling",208],["english",162],["ai",116]];
  function orbitOverview(dates, recs){
    var C = 320, N = dates.length, iso = tpeToday();
    var ringsSvg = RINGS.map(function(rr, ri){
      var kind = rr[0], R = rr[1], col = META[kind].pal[1];
      var days = daysOf(recs[kind], dates), max = 0, track = "", path = "";
      days.forEach(function(d){ max = Math.max(max, d.v); });
      days.forEach(function(d, i){
        var a = segAngles(i, N);
        track += sector(C, R, R+2, a[0], a[1]);
        if(d.v>0) path += sector(C, R, R+4+(d.v/(max||1))*34, a[0], a[1]);
      });
      return '<svg class="reveal ring-svg" viewBox="-24 -24 688 688" style="animation-delay:'+(ri*0.18).toFixed(2)+'s;pointer-events:none" aria-hidden="true">'+

  function timelineHtml(){
    var events = (state.goals && state.goals.events) || [], today = tpeToday();
    var items = events.map(function(ev){
      var d = Math.round((new Date(ev.date+"T00:00:00Z") - new Date(today+"T00:00:00Z"))/86400000);
      return {name:ev.name, date:ev.date, days:d, target:ev.target};
    }).filter(function(it){ return it.days>=0; }).sort(function(a,b){ return a.days-b.days; });
    if(!items.length) return '<div class="tl panel sec"><div class="hd"><span class="cap">ORBIT TIMELINE</span><span class="cap-sub">尚無設定目標</span></div></div>';
    var span = Math.max(30, items[items.length-1].days);
    var cols = [META.english.pal[1], META.running.pal[1], META.cycling.pal[1], META.ai.pal[1]];
    var months = [], dt = shiftDay(today,1);
    while(dt<=shiftDay(today,span)){
      if(dt.slice(8)==="01"){
        var dd = Math.round((new Date(dt+"T00:00:00Z") - new Date(today+"T00:00:00Z"))/86400000);
        months.push('<span class="mo" style="left:'+(dd/span*100).toFixed(1)+'%">'+esc(md(dt))+'</span>');
      }
      dt = shiftDay(dt,1);
    }
    return '<div class="tl panel sec">'+
      '<div class="hd"><span class="cap">ORBIT TIMELINE</span><span class="cap-sub">今天 → 下一個目標</span></div>'+
      '<div class="track">'+
        '<div class="line"></div><span class="travel"></span>'+months.join("")+
        '<span class="now"></span><span class="nowt">今天 '+esc(md(today))+'</span>'+
        items.map(function(it,i){
          var c = cols[i%cols.length];
          return '<div class="ev" style="left:'+(it.days/span*100).toFixed(1)+'%"><i style="background:'+c+'"></i>'+
            '<span><b style="color:'+c+'">'+(it.days===0?"今天":"D-"+it.days)+'</b> '+esc(it.name)+(it.target?' '+esc(it.target):'')+'</span></div>';
        }).join("")+
      '</div>'+
      '<div class="list">'+items.map(function(it,i){
        return '<div><b style="color:'+cols[i%cols.length]+'">'+(it.days===0?"今天":"D-"+it.days)+'</b>'+
          '<span>'+esc(it.name)+'</span><span>'+esc(md(it.date))+(it.target?' · '+esc(it.target):'')+'</span></div>';
      }).join("")+'</div>'+
    '</div>';
  }

  function orbitDetail(kind, days){
    var pal = META[kind].pal, n = days.length, max = 0;
    days.forEach(function(d){ max = Math.max(max, d.v); });
    var rMax = DR0+12+DMAX*0.85;
    var segs = days.map(function(d, i){
      var a = segAngles(i, n);
      return '<g class="sg" data-sel="'+esc(d.date)+'">'+
        '<path d="'+sector(DC, DR0, DR0+3, a[0], a[1])+'" fill="rgba(255,255,255,.09)"></path>'+
        (d.v>0 ? '<path d="'+detailSeg(d, i, n, max)+'" fill="url(#kg-'+kind+')"></path>'
               : '<path d="'+sector(DC, DR0, DR0+18, a[0], a[1])+'" fill="transparent"></path>')+
      '</g>';
    }).join("");
    // 環外標註：本期數值最高的幾天
    var top = days.map(function(d,i){ return {d:d, i:i}; }).filter(function(x){ return x.d.v>0; })
      .sort(function(a,b){ return b.d.v-a.d.v; }).slice(0, 5);
    var leads = "", tags = "";
    // 先算每個標註的位置，同一側的依高度排序後往下推開，相鄰幾天的標註才不會疊在一起
    var marks = top.map(function(x){
      var a = segAngles(x.i, n)[2], rr = DR0+12+(x.d.v/(max||1))*DMAX*0.85;
      var p1 = pt(DC, rr+6, a), p2 = pt(DC, rMax+26, a);
      return {x:x, p1:p1, p2:p2, right:p2[0]>=DC, y:p2[1]};
    });
    [true,false].forEach(function(side){
      var list = marks.filter(function(m){ return m.right===side; }).sort(function(a,b){ return a.y-b.y; });
      for(var k=1;k<list.length;k++) if(list[k].y-list[k-1].y<38) list[k].y = list[k-1].y+38;
    });
    marks.forEach(function(m, k){
      var x = m.x, right = m.right, p1 = m.p1, p2 = [m.p2[0], m.y];
      var p3 = [p2[0]+(right?18:-18), m.y], tx = p3[0]+(right?6:-6), anchor = right?"start":"end";
      var delay = (1.3+k*0.15).toFixed(2);
      var sub = (kind==="running"||kind==="cycling") ? (x.d.name||"") :
        (kind==="english" ? num(x.d.q)+" 題 · "+num(x.d.vocab)+" 詞" : num(x.d.sessions)+" sessions");
      leads += '<path class="draw" d="M'+r1(p1[0])+' '+r1(p1[1])+'L'+r1(p2[0])+' '+r1(p2[1])+'L'+r1(p3[0])+' '+r1(p3[1])+'" '+
        'fill="none" stroke="'+pal[2]+'" stroke-width="1" pathLength="100" style="animation-delay:'+delay+'s;animation-duration:.7s"></path>';
      tags += '<g class="up" style="animation-delay:'+delay+'s">'+
        '<text x="'+r1(tx)+'" y="'+r1(p3[1]-4)+'" text-anchor="'+anchor+'" font-family="JetBrains Mono,monospace" font-size="12" fill="'+pal[2]+'">'+
          esc(md(x.d.date))+' · '+esc(valueLabel(kind, x.d))+'</text>'+
        '<text x="'+r1(tx)+'" y="'+r1(p3[1]+13)+'" text-anchor="'+anchor+'" font-family="Noto Sans TC,sans-serif" font-size="13" fill="rgba(238,234,248,.85)">'+
          esc(sub)+'</text></g>';
    });
    // 中央：本期總量、目標弧
    var total = sumOf(days,"v"), prog = 0, l1, l2, l3, bigTx;
    if(kind==="running" || kind==="cycling"){
      var goal = goalFor(kind, n);
      prog = goal ? Math.min(1, total/goal) : 0;
      bigTx = f1(total); l1 = "KM · "+winTag();
      l2 = goal ? "目標 "+Math.round(goal)+" km · "+Math.round(total/goal*100)+"%" : "目標未設定";
      l3 = goal ? (goal>total ? "還差 "+f1(goal-total)+" km" : "已達標 +"+f1(total-goal)+" km") : "";
    } else if(kind==="english"){
      var sc = latestScore();
      prog = sc.score!=null ? sc.score/990 : 0;
      bigTx = f1(total); l1 = "HRS · "+winTag();
      l2 = sc.score!=null ? "多益預測 "+num(sc.score)+" / 990" : "尚無多益預測";
      var tgt = (state.goals||{}).enTargetScore;
      l3 = (tgt!=null && sc.score!=null) ? (sc.score>=tgt ? "目標 "+num(tgt)+" 已達標" : "距目標 "+num(tgt)+" 還差 "+(tgt-sc.score)) : "";
    } else {
      var act = activeOf(days).length;
      prog = n ? act/n : 0;
      bigTx = f1(total); l1 = "HRS · "+winTag();
      l2 = "活躍 "+act+" / "+n+" 天";
      l3 = act ? "活躍日平均 "+f1(total/act)+" h" : "";
    }
    var gTicks = 2*Math.PI*282, gN = n;
    return '<div class="orbit">'+
      '<div class="radar" aria-hidden="true" style="inset:10%;background:conic-gradient(from 0deg,rgba('+rgbOf(pal[1])+',0) 0deg,rgba('+rgbOf(pal[1])+',0) 290deg,rgba('+rgbOf(pal[1])+',.2) 360deg);'+
        '-webkit-mask-image:radial-gradient(circle closest-side,transparent 50%,#000 51%,#000 82%,transparent 83%);mask-image:radial-gradient(circle closest-side,transparent 50%,#000 51%,#000 82%,transparent 83%)"></div>'+
      '<svg class="spin-slow" viewBox="-80 -80 760 760" aria-hidden="true">'+
        '<circle cx="300" cy="300" r="282" fill="none" stroke="rgba(238,234,248,.3)" stroke-width="6" stroke-dasharray="1.2 '+r1(gTicks/gN-1.2)+'"></circle>'+
        '<circle cx="300" cy="300" r="282" fill="none" stroke="rgba(238,234,248,.07)" stroke-width="1"></circle></svg>'+
      '<svg class="reveal" viewBox="-80 -80 760 760" role="group" aria-label="每日數據，點選可查看當天">'+
        '<defs><radialGradient id="kg-'+kind+'" gradientUnits="userSpaceOnUse" cx="300" cy="300" r="'+r1(rMax)+'">'+
          '<stop offset="'+(DR0/rMax).toFixed(3)+'" stop-color="'+pal[0]+'"></stop>'+
          '<stop offset="'+((DR0+DMAX*0.35)/rMax).toFixed(3)+'" stop-color="'+pal[1]+'"></stop>'+
          '<stop offset="0.9" stop-color="'+pal[2]+'"></stop>'+
          '<stop offset="1" stop-color="'+pal[3]+'"></stop></radialGradient></defs>'+
        '<g style="filter:drop-shadow(0 0 8px rgba('+rgbOf(pal[1])+',.55))">'+segs+'</g></svg>'+
      '<svg viewBox="-80 -80 760 760" aria-hidden="true" style="pointer-events:none">'+
        '<defs><linearGradient id="ka-'+kind+'" x1="0" y1="0" x2="1" y2="1">'+
          '<stop offset="0" stop-color="'+pal[0]+'"></stop><stop offset=".55" stop-color="'+pal[1]+'"></stop><stop offset="1" stop-color="'+pal[3]+'"></stop></linearGradient>'+
          '<linearGradient id="kt-'+kind+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0" stop-color="'+pal[3]+'"></stop><stop offset=".6" stop-color="'+pal[1]+'"></stop><stop offset="1" stop-color="'+pal[0]+'"></stop></linearGradient></defs>'+
        '<path id="selSeg" d="" fill="none" stroke="#fff" stroke-width="2"></path>'+
        '<path id="selPing" class="ping" d="" fill="none" stroke="#fff" stroke-width="1.5"></path>'+
        '<circle cx="300" cy="300" r="128" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="6"></circle>'+
        '<circle class="arc" cx="300" cy="300" r="128" fill="none" stroke="url(#ka-'+kind+')" stroke-width="6" stroke-linecap="round" '+
          'pathLength="100" stroke-dasharray="100" stroke-dashoffset="'+(100-prog*100).toFixed(1)+'" transform="rotate(-90 300 300)"></circle>'+
        '<circle cx="300" cy="300" r="112" fill="none" stroke="rgba('+rgbOf(pal[2])+',.25)" stroke-width="1" stroke-dasharray="2 5" class="spin-rev"></circle>'+
        leads+tags+
        '<text x="300" y="248" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="12" letter-spacing="2.4" fill="rgba(238,234,248,.5)">'+esc(l1)+'</text>'+
        '<text class="up" x="300" y="312" text-anchor="middle" font-family="Sora,sans-serif" font-weight="300" font-size="64" fill="url(#kt-'+kind+')" '+
          'style="animation-delay:.3s;filter:drop-shadow(0 0 18px rgba('+rgbOf(pal[1])+',.4))">'+esc(bigTx)+'</text>'+
        '<text x="300" y="344" text-anchor="middle" font-family="Noto Sans TC,sans-serif" font-size="14" fill="'+pal[2]+'">'+esc(l2)+'</text>'+
        '<text x="300" y="366" text-anchor="middle" font-family="Noto Sans TC,sans-serif" font-size="12" fill="rgba(238,234,248,.45)">'+esc(l3)+'</text>'+
      '</svg>'+
    '</div>';
  }

  function rowsHtml(kind, days){

        '<span class="x">'+esc(valueLabel(kind, d))+'</span></button>';

  // 底部趨勢：跑步／騎車／AI 是 8 月起的累計，英文是多益預測分數
  function trendHtml(kind, by){
    var pal = META[kind].pal, first = minKey(by), today = tpeToday();
    if(!first) return '<div class="hd"><span class="cap">TREND</span></div><div class="empty">尚無紀錄</div>';
    var dates = rangeDates(first, today), n = dates.length;
    function X(i){ return n>1 ? i/(n-1)*1000 : 0; }
    var line = "", dots = [], cap, sub, note = "", goalPath = "", yMax, yMin = 0;
    if(kind==="english"){
      var pts = [];
      dates.forEach(function(dt, i){ var t = by[dt]; if(t && t.score!=null) pts.push([i, Number(t.score)]); });
      var tgt = (state.goals||{}).enTargetScore;
      var vals = pts.map(function(p){ return p[1]; }).concat(tgt!=null? [tgt]:[]);
      yMin = Math.max(0, Math.floor((Math.min.apply(null, vals.length? vals:[700])-30)/10)*10);
      yMax = Math.min(990, Math.ceil((Math.max.apply(null, vals.length? vals:[900])+20)/10)*10);
      var Y = function(v){ return 112-(v-yMin)/((yMax-yMin)||1)*104; };
      pts.forEach(function(p, k){ line += (k?"L":"M")+r1(X(p[0]))+" "+r1(Y(p[1])); dots.push([X(p[0])/10, Y(p[1])/1.2]); });
      if(tgt!=null) goalPath = "M0 "+r1(Y(tgt))+" L1000 "+r1(Y(tgt));
      var last = pts.length ? pts[pts.length-1][1] : null;
      cap = "TOEIC TREND"; sub = "多益預測分數"+(last!=null? " · 目前 "+last:"");
      note = tgt!=null ? "虛線 = 目標 "+tgt+" 分" : "";
    } else {
      var cum = 0, series = [];
      dates.forEach(function(dt){ var t = by[dt]; cum += t ? t.v : 0; series.push(cum); });
      var monthly = kind==="running" ? (state.goals||{}).runMonthlyKm : (kind==="cycling" ? (state.goals||{}).rideMonthlyKm : null);
      var goalEnd = monthly!=null ? monthly*n/30 : 0;
      yMax = Math.max(cum, goalEnd)*1.08 || 1;
      var Yc = function(v){ return 112-v/yMax*104; };
      var prev = 0;
      series.forEach(function(v, i){
        line += i ? "L"+r1(X(i))+" "+r1(Yc(prev))+"L"+r1(X(i))+" "+r1(Yc(v)) : "M0 "+r1(Yc(v));
        if(v!==prev || (i===0 && v>0)) dots.push([X(i)/10, Yc(v)/1.2]);
        prev = v;
      });
      if(monthly!=null) goalPath = "M0 "+r1(Yc(0))+" L1000 "+r1(Yc(goalEnd));
      var unit = kind==="ai" ? " h" : " km", act = Object.keys(by).filter(function(k){ return by[k].v>0; }).length;
      cap = "CUMULATIVE";
      sub = md(first)+" 起累計 "+f1(cum)+unit+" · "+act+(kind==="ai"?" 個活躍日":" 次")+
        (kind==="cycling" ? " · 爬升 "+comma(Object.keys(by).reduce(function(a,k){ return a+(by[k].elev||0); },0))+" m" : "");
      note = monthly!=null ? "虛線 = 每月 "+monthly+" km 目標" : "";
    }
    var area = line ? line+" L"+r1(kind==="english" ? X(dates.length-1) : 1000)+" 120 L0 120 Z" : "";
    if(kind==="english" && line){
      var firstX = line.match(/^M([\d.]+)/);
      area = line+" L"+line.match(/L?([\d.]+) [\d.]+$/)[1]+" 120 L"+(firstX?firstX[1]:0)+" 120 Z";
    }
    var ax = ['<span style="left:0">'+esc(md(first))+'</span>'];
    dates.forEach(function(dt, i){ if(i>0 && i<n-4 && dt.slice(8)==="01") ax.push('<span style="left:'+(X(i)/10).toFixed(2)+'%">'+esc(md(dt))+'</span>'); });
    ax.push('<span class="end" style="left:100%">'+esc(md(today))+'</span>');
    var rgb = rgbOf(pal[1]);
    return '<div class="hd"><span class="cap">'+cap+'</span><span class="cap-sub">'+esc(sub)+'</span><span class="r">'+esc(note)+'</span></div>'+
      '<div class="plot"><svg class="wipe" viewBox="0 0 1000 120" preserveAspectRatio="none" aria-hidden="true" style="animation-delay:.4s">'+
        '<defs><linearGradient id="tl-'+kind+'" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="'+pal[0]+'"></stop><stop offset=".6" stop-color="'+pal[1]+'"></stop><stop offset="1" stop-color="'+pal[3]+'"></stop></linearGradient>'+
        '<linearGradient id="ta-'+kind+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba('+rgb+',.32)"></stop><stop offset="1" stop-color="rgba('+rgb+',0)"></stop></linearGradient></defs>'+
        (goalPath ? '<path d="'+goalPath+'" fill="none" stroke="rgba(238,234,248,.3)" stroke-width="1" stroke-dasharray="4 6" vector-effect="non-scaling-stroke"></path>' : '')+
        (area ? '<path class="fadeIn" d="'+area+'" fill="url(#ta-'+kind+')" style="animation-delay:1.6s"></path>' : '')+
        (line ? '<path d="'+line+'" fill="none" stroke="url(#tl-'+kind+')" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>' : '')+
      '</svg>'+
      dots.map(function(p, i){ return '<span class="dot fadeIn" style="left:'+p[0].toFixed(2)+'%;top:'+p[1].toFixed(2)+'%;animation-delay:'+(1.2+i*0.04).toFixed(2)+'s"></span>'; }).join("")+
      '</div><div class="ax">'+ax.join("")+'</div>';
  }

  // ---------- 數字跳動 ----------
  function countUp(root){
    if(REDUCE_MOTION) return;
    Array.prototype.forEach.call(root.querySelectorAll(".cnt"), function(el){
      var to = Number(el.getAttribute("data-to"))||0, dec = Number(el.getAttribute("data-dec"))||0, t0 = null;
      function tick(t){
        if(t0===null) t0 = t;
        var k = Math.min(1, (t-t0)/1100), e = 1-Math.pow(1-k,3);
        el.textContent = (to*e).toFixed(dec);
        if(k<1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  // 滑到才播：每個 .sec 進入畫面才加上 .in，進場動畫與數字跳動從那一刻開始
  var io = (typeof IntersectionObserver==="function" && !REDUCE_MOTION) ? new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      en.target.classList.add("in");
      countUp(en.target);
      io.unobserve(en.target);
    });
  }, {rootMargin:"0px 0px -80px 0px", threshold:0}) : null;
  function armSections(){
    if(io) io.disconnect();
    Array.prototype.forEach.call(document.querySelectorAll("#view .sec"), function(el){
      if(io) io.observe(el); else el.classList.add("in");
    });
  }

    // 注意：不要因為沒有 sample 就藏起按鈕 —— 手動輸入表單不需要讀圖能力，

  // ---------- 圖片前處理 ----------
  // sample 只吃 JPEG / PNG / WebP / GIF，iPhone 拍的 HEIC 會被退件，
  // 所以一律先在瀏覽器裡解碼、縮圖、轉成 JPEG 再送出。
  // 整個過程都在記憶體裡，原圖不會被儲存，轉檔完就釋放。
  var OK_TYPES = {"image/jpeg":1,"image/png":1,"image/webp":1,"image/gif":1};
  var MAX_EDGE = 1600;

  function decodeViaImg(file){
    return new Promise(function(res,rej){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){ URL.revokeObjectURL(url); res(img); };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("decode_failed")); };
      img.src = url;
    });
  }

  async function prepareImage(file){
    var src = null;
    try{
      src = await createImageBitmap(file);
    }catch(e){
      try{ src = await decodeViaImg(file); }catch(e2){ src = null; }
    }
    if(!src){
      // 解不開（例如非 Safari 瀏覽器遇到 HEIC）：原檔本來就是可接受的格式就直接送
      if(OK_TYPES[file.type]) return file;
      throw {code:"decode_failed"};
    }
    var w0 = src.width||src.naturalWidth, h0 = src.height||src.naturalHeight;
    var scale = Math.min(1, MAX_EDGE/Math.max(w0,h0));
    var w = Math.max(1,Math.round(w0*scale)), h = Math.max(1,Math.round(h0*scale));
    var cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(src,0,0,w,h);
    if(src.close) src.close();          // 釋放解碼後的點陣資料
    var blob = await new Promise(function(res){ cv.toBlob(res,"image/jpeg",0.9); });
    cv.width = cv.height = 0;           // 釋放畫布
    if(!blob) throw {code:"decode_failed"};
    return blob;
  }

  function errMsg(e){

      not_declared:"設定有誤，請重新整理頁面",

      image_rejected:"圖片格式不支援或過大，請換一張",
      rate_limited:"請求過多，請稍後再試",
      invalid_json:"讀不出截圖內容，請換一張更清楚的",
      decode_failed:"這張圖無法讀取，請改用 JPG 或 PNG",

  async function handleUpload(kind, file){
    // 分開判斷，訊息才說得出「為什麼」不能用

    showToast("處理圖片中…", true);
    var img;
    try{
      img = await prepareImage(file);

      hideToast();

    await saveEntry(kind, data, "screenshot");
  }

  // 手動表單與截圖擷取共用同一段寫入邏輯，兩條路徑產生的資料形狀一致
  async function saveEntry(kind, data, source){
    if(!db){ showToast("讀不到資料庫，請重新整理頁面再試", false); return; }
    var today = tpeToday();
    var src = source || "manual";
    var noteFallback = src==="screenshot" ? "截圖擷取" : "手動輸入";
    try{
      if(kind==="english"){
        var ecur = state.english || {history:[]};
        var entry = {
          date: data.date || today,
          toeic_predicted: typeof data.toeic_predicted==="number"? data.toeic_predicted:null,
          toeic_lc: typeof data.toeic_lc==="number"? data.toeic_lc:null,
          toeic_rc: typeof data.toeic_rc==="number"? data.toeic_rc:null,
          goal_score: typeof data.goal_score==="number"? data.goal_score:null,
          study_time_sec: typeof data.study_time_sec==="number"? data.study_time_sec:null,
          goal_percent: typeof data.goal_percent==="number"? data.goal_percent:null,
          questions_count: typeof data.questions_count==="number"? data.questions_count:null,
          vocab_count: typeof data.vocab_count==="number"? data.vocab_count:null,
          note: data.note || noteFallback, source:src, addedAt:new Date().toISOString()
        };
        var hist = (ecur.history||[]).slice();
        hist.push(entry);
        if(hist.length>20) hist = hist.slice(hist.length-20);
        await db.doc("stats/english").set({latest:entry, history:hist, lastUpdated:new Date().toISOString()});
        showToast("已更新英文學習紀錄", false);
      } else {
        var cur = state[kind];
        var manual = (cur && cur.manualEntries || []).slice();
        manual.push({
          addedAt:new Date().toISOString(),
          date: data.date || today,
          distance_km: typeof data.distance_km==="number"? data.distance_km:null,
          duration_sec: typeof data.duration_sec==="number"? data.duration_sec:null,
          elevation_gain_m: typeof data.elevation_gain_m==="number"? data.elevation_gain_m:null,
          note: data.note || noteFallback, source:src
        });
        if(manual.length>20) manual = manual.slice(manual.length-20);
        if(cur) await db.doc("stats/"+kind).update({manualEntries:manual});
        else await db.doc("stats/"+kind).set({manualEntries:manual});
        showToast("已新增手動紀錄", false);
      }
    }catch(e){
      // 把真正的錯誤碼顯示出來，不要用一句「請再試一次」把線索蓋掉
      var code = (e && (e.code || e.message)) ? String(e.code || e.message) : "未知錯誤";
      showToast("儲存失敗：" + code, false);
      try{ console.error("[dashboard] saveEntry failed", kind, e); }catch(_){}
    }
  }

  // ---------- 手動輸入 ----------
  // 讀圖能力並非每個檢視都有，手動輸入才是隨時都能用的路徑。
  var FORMS = {
    running:{title:"新增跑步紀錄", sub:"這筆會疊加到 Strava 同步的數字上", fields:[
      {k:"date",label:"日期",type:"date",wide:false},
      {k:"distance_km",label:"距離 (KM)",type:"number",step:"0.01",ph:"6"},
      {k:"duration_min",label:"時間 (分鐘)",type:"number",step:"1",ph:"38"},
      {k:"note",label:"備註",type:"text",ph:"跑步機 6 公里",wide:true}
    ]},
    cycling:{title:"新增騎車紀錄", sub:"這筆會疊加到 Strava 同步的數字上", fields:[
      {k:"date",label:"日期",type:"date"},
      {k:"distance_km",label:"距離 (KM)",type:"number",step:"0.01",ph:"45.5"},
      {k:"duration_min",label:"時間 (分鐘)",type:"number",step:"1",ph:"125"},
      {k:"elevation_gain_m",label:"爬升 (M)",type:"number",step:"1",ph:"600"},
      {k:"note",label:"備註",type:"text",ph:"河濱來回",wide:true}
    ]},
    english:{title:"更新英文學習紀錄", sub:"填得到的就填，空白的欄位不會顯示", fields:[
      {k:"date",label:"日期",type:"date"},
      {k:"toeic_predicted",label:"多益預測",type:"number",ph:"800"},
      {k:"toeic_lc",label:"LC",type:"number",ph:"420"},
      {k:"toeic_rc",label:"RC",type:"number",ph:"380"},
      {k:"study_time_min",label:"學習時間 (分鐘)",type:"number",ph:"66"},
      {k:"questions_count",label:"題目數",type:"number",ph:"41"},
      {k:"vocab_count",label:"詞彙數",type:"number",ph:"10"},
      {k:"note",label:"備註",type:"text",ph:"每日學習紀錄",wide:true}
    ]}
  };

  var modal = document.getElementById("modal"), modalKind = null;

  function openForm(kind){
    modalKind = kind;
    var cfg = FORMS[kind];
    document.getElementById("modal-title").textContent = cfg.title;
    document.getElementById("modal-sub").textContent = cfg.sub;
    document.getElementById("modal-fields").innerHTML = cfg.fields.map(function(f){
      return '<div class="f'+(f.wide?" wide":"")+'">'+
        '<label for="fld-'+esc(f.k)+'">'+esc(f.label)+'</label>'+
        '<input id="fld-'+esc(f.k)+'" type="'+esc(f.type)+'"'+
        (f.step? ' step="'+esc(f.step)+'"':'')+
        (f.ph? ' placeholder="'+esc(f.ph)+'"':'')+
        (f.type==="date"? ' value="'+esc(tpeToday())+'"':'')+'>'+
      '</div>';
    }).join("");
    // 只有這個檢視真的能送圖時，才提供截圖自動填入
    document.getElementById("modal-shot").hidden = !(sample && sampleImages && db);
    modal.hidden = false;
    // 在欄位裡按 Enter 就送出 —— 這些 input 不在 <form> 裡，
    // 沒有這段的話按 Enter 什麼都不會發生，很容易誤以為已經存好了
    modal.querySelectorAll("#modal-fields input").forEach(function(el){
      el.addEventListener("keydown", function(e){
        if(e.key==="Enter"){ e.preventDefault(); document.getElementById("modal-save").click(); }
      });
    });
    var first = modal.querySelector("input");
    if(first) first.focus();
  }
  function closeForm(){ modal.hidden = true; modalKind = null; }

  function readForm(){
    var out = {};
    FORMS[modalKind].fields.forEach(function(f){
      var el = document.getElementById("fld-"+f.k);
      if(!el) return;
      var v = el.value.trim();
      if(v==="") { out[f.k] = null; return; }
      out[f.k] = (f.type==="number") ? (isFinite(Number(v))? Number(v) : null) : v;
    });
    // 表單用分鐘輸入，資料庫存秒
    if(out.duration_min!=null){ out.duration_sec = Math.round(out.duration_min*60); }
    if(out.study_time_min!=null){ out.study_time_sec = Math.round(out.study_time_min*60); }
    return out;
  }

  document.getElementById("modal-close").addEventListener("click", closeForm);
  document.getElementById("modal-cancel").addEventListener("click", closeForm);
  modal.addEventListener("click", function(e){ if(e.target===modal) closeForm(); });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape" && !modal.hidden) closeForm();
  });
  document.getElementById("modal-save").addEventListener("click", async function(){
    var kind = modalKind, data = readForm();
    var hasValue = Object.keys(data).some(function(k){
      return k!=="date" && data[k]!=null && data[k]!=="";
    });
    if(!hasValue){ showToast("至少填一個數值再儲存", false); return; }
    closeForm();
    await saveEntry(kind, data, "manual");
  });
  document.getElementById("modal-shot-btn").addEventListener("click", function(){
    var inp = document.getElementById("file-"+modalKind);
    inp.value = ""; inp.click();
  });

  ["running","cycling","english"].forEach(function(kind){
    var btn = document.getElementById("add-"+kind), inp = document.getElementById("file-"+kind);
    // 開檔案選擇器之前就先擋掉不可能成功的情況，
    // 不要讓使用者挑完照片才被告知失敗
    btn.addEventListener("click", function(){
      if(btn.disabled) return;
      if(staticMode || !db){
        showToast("公開版無法編輯，請改用 Claude 裡的 dashboard", false); return;
      }
      openForm(kind);
    });
    inp.addEventListener("change", function(){
      var f = inp.files && inp.files[0];
      if(f) handleUpload(kind, f);
    });
  });


  renderAll();
})();
</script>
